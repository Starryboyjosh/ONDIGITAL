<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — OnDental Clínica Digital</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="login-viewport">

  <div class="card login-card">
    <div class="login-brand">
      <div class="login-logo">OD</div>
      <div class="login-brand-name">On<span class="acc">Dental</span></div>
    </div>
    
    <p class="login-lead">Sistema Inteligente de Gestión Dental e Historias Clínicas</p>

    <!-- Caja de alertas dinámicas -->
    <div id="login-alert" class="login-alert"></div>

    <form id="login-form">
      <div class="form-group" style="text-align: left;">
        <label class="form-label" for="username">Usuario Clínico</label>
        <input type="text" id="username" class="form-control" placeholder="Escriba su usuario..." required autocomplete="username">
      </div>

      <div class="form-group" style="text-align: left; margin-bottom: 25px;">
        <label class="form-label" for="password">Contraseña</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem;">
        Verificar y Acceder
        <svg style="width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;" viewBox="0 0 24 24">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

  </div>

  <script>
    // Comprobar parámetros de URL (ej. si fue redirigido por no estar autenticado)
    const urlParams = new URLSearchParams(window.location.search);
    const alertBox = document.getElementById('login-alert');

    if (urlParams.get('error') === 'unauthorized') {
      alertBox.textContent = 'Acceso Restringido. Por favor, inicie sesión.';
      alertBox.style.display = 'block';
    }

    // 1. Detección en tiempo real del usuario para Branding Dinámico de la Empresa
    const usernameInput = document.getElementById('username');
    const brandName = document.querySelector('.login-brand-name');
    const brandLogo = document.querySelector('.login-logo');

    usernameInput.addEventListener('input', function() {
      const username = this.value.trim().toLowerCase();
      const validUsers = window.auth ? window.auth.getValidUsers() : [];
      const user = validUsers.find(u => u.username === username);

      if (user) {
        const companies = {
          'credental': { name: 'Credental', accent: '#0f9d8a' },
          'ondental-central': { name: 'OnDental Clínica Central', accent: '#2563eb' },
          'sonrisa-perfecta': { name: 'Sonrisa Perfecta', accent: '#d97706' },
          'dentpro': { name: 'DentPro Consultores', accent: '#7c3aed' }
        };
        const company = companies[user.companyId];

        if (company) {
          // Cambiar color de acento principal
          document.documentElement.style.setProperty('--color-blue-mid', company.accent);

          // Actualizar logo con iniciales corporativas
          const parts = company.name.trim().split(/\s+/);
          brandLogo.textContent = (parts.length >= 2
            ? parts[0][0] + parts[1][0]
            : parts[0].slice(0, 2)).toUpperCase();
          brandLogo.style.background = company.accent;

          // Actualizar título
          const name = company.name;
          if (name.toLowerCase().includes('dental')) {
            const parts = name.split(/(dental)/i);
            brandName.innerHTML = `${parts[0]}<span class="acc">${parts[1]}</span>${parts.slice(2).join('')}`;
          } else {
            const words = name.split(' ');
            if (words.length >= 2) {
              brandName.innerHTML = `${words[0]} <span class="acc">${words.slice(1).join(' ')}</span>`;
            } else {
              brandName.innerHTML = `<span class="acc">${name}</span>`;
            }
          }
          return;
        }
      }

      // Restablecer al branding corporativo por defecto
      document.documentElement.style.setProperty('--color-blue-mid', '#2563eb');
      brandLogo.textContent = 'OD';
      brandLogo.style.background = '';
      brandName.innerHTML = 'On<span class="acc">Dental</span>';
    });

    // 2. Lógica de envío del Formulario
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const userVal = usernameInput.value;
      const passVal = document.getElementById('password').value;

      // Ocultar alerta inicial
      alertBox.style.display = 'none';

      // Llamar al validador del script auth.js
      const result = window.auth.login(userVal, passVal);

      if (result.success) {
        // Redirigir al dashboard si las credenciales coinciden
        window.location.href = 'dashboard.html';
      } else {
        // Mostrar error con animación shake
        alertBox.textContent = result.message;
        alertBox.style.display = 'block';
        
        // Reiniciar animación shake
        alertBox.classList.remove('shake');
        void alertBox.offsetWidth; // Forzar reflow
        alertBox.classList.add('shake');
      }
    });
  </script>
</body>
</html>
