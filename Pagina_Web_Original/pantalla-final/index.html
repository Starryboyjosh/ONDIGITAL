<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#02050c">
    <meta name="robots" content="noindex">
    <title>ONDIGITAL · Pantalla</title>
    <link rel="stylesheet" href="pantalla.css">
</head>
<body>
    <div class="pantalla">
        <main class="escenario" aria-labelledby="lema-principal">

            <div class="marca-fija" aria-label="ONDIGITAL">
                <span class="marca-nombre"><b>ON</b>DIGITAL</span>
            </div>

            <h1 class="lema" id="lema-principal"><span>Todo lo vital</span><span>es <em data-text="DIGITAL">DIGITAL</em>.</span></h1>

            <section class="escena" aria-label="Capacidades de ONDIGITAL">

                <div class="nucleo">
                    <svg class="orbitas" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <circle class="orbita-anillo a1" cx="200" cy="200" r="92"></circle>
                        <circle class="orbita-anillo a2" cx="200" cy="200" r="128"></circle>
                        <circle class="orbita-anillo a3" cx="200" cy="200" r="160"></circle>

                        <line class="orbita-linea" x1="302.6" y1="113.8" x2="330.2" y2="90.7"></line>
                        <line class="orbita-linea" x1="309.7" y1="276.9" x2="339.2" y2="297.6"></line>
                        <line class="orbita-linea" x1="200" y1="334" x2="200" y2="370"></line>
                        <line class="orbita-linea" x1="90.3" y1="276.9" x2="60.8" y2="297.6"></line>
                        <line class="orbita-linea" x1="97.4" y1="113.8" x2="69.8" y2="90.7"></line>
                    </svg>

                    <div class="aura" aria-hidden="true">
                        <span class="aura-onda o1"></span>
                        <span class="aura-onda o2"></span>
                        <span class="aura-onda o3"></span>
                        <span class="aura-nucleo"></span>
                    </div>
                    <div class="sombra" aria-hidden="true"></div>

                    <div class="robot-logo-large">
                        <div class="robot-3d">
                            <svg class="robot-svg" viewBox="88 46 200 210" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vito, el asistente de ONDIGITAL">
                                <defs>
                                    <linearGradient id="vitoBodyGrad" x1="100" y1="92" x2="268" y2="236" gradientUnits="userSpaceOnUse">
                                        <stop stop-color="#4BA3FF"/>
                                        <stop offset=".45" stop-color="#1A6FE8"/>
                                        <stop offset="1" stop-color="#0A2F6E"/>
                                    </linearGradient>
                                    <linearGradient id="vitoBodySide" x1="252" y1="92" x2="280" y2="232" gradientUnits="userSpaceOnUse">
                                        <stop stop-color="#0D3E8A"/>
                                        <stop offset="1" stop-color="#061830"/>
                                    </linearGradient>
                                    <linearGradient id="vitoHandleGrad" x1="148" y1="56" x2="212" y2="96" gradientUnits="userSpaceOnUse">
                                        <stop stop-color="#5AB0FF"/>
                                        <stop offset="1" stop-color="#0A5FD4"/>
                                    </linearGradient>
                                    <linearGradient id="vitoScreenGrad" x1="112" y1="110" x2="248" y2="218" gradientUnits="userSpaceOnUse">
                                        <stop stop-color="#071428"/>
                                        <stop offset=".55" stop-color="#040c1c"/>
                                        <stop offset="1" stop-color="#020610"/>
                                    </linearGradient>
                                    <linearGradient id="vitoGlass" x1="120" y1="112" x2="230" y2="200" gradientUnits="userSpaceOnUse">
                                        <stop stop-color="#fff" stop-opacity=".16"/>
                                        <stop offset=".35" stop-color="#fff" stop-opacity=".04"/>
                                        <stop offset="1" stop-color="#00E5B0" stop-opacity="0"/>
                                    </linearGradient>
                                    <linearGradient id="vitoBevel" x1="108" y1="96" x2="250" y2="220" gradientUnits="userSpaceOnUse">
                                        <stop stop-color="#fff" stop-opacity=".28"/>
                                        <stop offset=".4" stop-color="#fff" stop-opacity=".06"/>
                                        <stop offset="1" stop-color="#000" stop-opacity=".2"/>
                                    </linearGradient>
                                </defs>

                                <g class="robot-body-stack">
                                    <rect class="robot-body-cast" x="106" y="100" width="162" height="142" rx="18" fill="#020810" opacity=".45"/>
                                    <path class="robot-body-side" d="M252 98 C268 100 274 110 274 126 L274 214 C274 228 266 238 250 240 L248 100 Z" fill="url(#vitoBodySide)"/>
                                    <rect class="robot-body-main" x="100" y="92" width="160" height="140" rx="18" fill="url(#vitoBodyGrad)"/>
                                    <rect class="robot-body-rim" x="102" y="94" width="156" height="136" rx="16" stroke="url(#vitoBevel)" stroke-width="2.2" fill="none"/>
                                    <path class="robot-body-spec" d="M118 104 H236 C244 104 248 110 248 118 V148 C220 130 170 118 118 122 Z" fill="#fff" opacity=".1"/>
                                </g>

                                <g class="robot-handle">
                                    <path d="M150 94 C150 62 210 62 210 94" stroke="#041428" stroke-width="18" fill="none" stroke-linecap="round" opacity=".55"/>
                                    <path d="M150 92 C150 60 210 60 210 92" stroke="url(#vitoHandleGrad)" stroke-width="14" fill="none" stroke-linecap="round"/>
                                    <path d="M154 88 C156 68 204 68 206 88" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".22"/>
                                </g>

                                <g class="robot-screen">
                                    <rect x="114" y="112" width="136" height="108" rx="14" fill="#000" opacity=".35"/>
                                    <rect x="112" y="110" width="136" height="108" rx="14" fill="url(#vitoScreenGrad)"/>
                                    <rect x="114" y="112" width="132" height="104" rx="12" stroke="rgba(0,229,176,.18)" stroke-width="1.2" fill="none"/>
                                    <rect x="116" y="114" width="80" height="48" rx="10" fill="url(#vitoGlass)"/>
                                </g>

                                <g class="robot-eye-group eye-left">
                                    <circle class="robot-eye" cx="153" cy="154" r="13" fill="none" stroke="#00E5B0" stroke-width="4"></circle>
                                    <circle class="robot-pupil" cx="153" cy="154" r="4.5" fill="#00E5B0"></circle>
                                </g>
                                <g class="robot-eye-group eye-right">
                                    <circle class="robot-eye" cx="207" cy="154" r="13" fill="none" stroke="#00E5B0" stroke-width="4"></circle>
                                    <circle class="robot-pupil" cx="207" cy="154" r="4.5" fill="#00E5B0"></circle>
                                </g>

                                <path class="robot-mouth-large" d="M140 178 Q180 200 220 178" stroke="#00E5B0" stroke-width="5" fill="none" stroke-linecap="round"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <ul class="nodos" id="nodos">
                    <li class="nodo-shell hacia-izq" data-capacidad="ia" style="--marca:#00E5B0; --retardo:0s">
                        <button class="nodo" type="button" aria-expanded="false" aria-controls="tarjeta-ia">IA · Vito</button>
                        <div class="nodo-tarjeta" id="tarjeta-ia" role="group">
                            <div class="tarjeta-visual" aria-hidden="true"></div>
                            <div class="tarjeta-copy">
                                <h2 class="tarjeta-titulo"></h2>
                                <p class="tarjeta-texto"></p>
                                <ul class="tarjeta-tags"></ul>
                            </div>
                        </div>
                    </li>

                    <li class="nodo-shell hacia-der" data-capacidad="webs" style="--marca:#2B8AF7; --retardo:1.1s">
                        <button class="nodo" type="button" aria-expanded="false" aria-controls="tarjeta-webs">Webs</button>
                        <div class="nodo-tarjeta" id="tarjeta-webs" role="group">
                            <div class="tarjeta-visual" aria-hidden="true"></div>
                            <div class="tarjeta-copy">
                                <h2 class="tarjeta-titulo"></h2>
                                <p class="tarjeta-texto"></p>
                                <ul class="tarjeta-tags"></ul>
                            </div>
                        </div>
                    </li>

                    <li class="nodo-shell hacia-der" data-capacidad="apps" style="--marca:#1A9EDA; --retardo:2.2s">
                        <button class="nodo" type="button" aria-expanded="false" aria-controls="tarjeta-apps">Apps</button>
                        <div class="nodo-tarjeta" id="tarjeta-apps" role="group">
                            <div class="tarjeta-visual" aria-hidden="true"></div>
                            <div class="tarjeta-copy">
                                <h2 class="tarjeta-titulo"></h2>
                                <p class="tarjeta-texto"></p>
                                <ul class="tarjeta-tags"></ul>
                            </div>
                        </div>
                    </li>

                    <li class="nodo-shell hacia-arriba" data-capacidad="auto" style="--marca:#3DD68C; --retardo:3.3s">
                        <button class="nodo" type="button" aria-expanded="false" aria-controls="tarjeta-auto">Automatización</button>
                        <div class="nodo-tarjeta" id="tarjeta-auto" role="group">
                            <div class="tarjeta-visual" aria-hidden="true"></div>
                            <div class="tarjeta-copy">
                                <h2 class="tarjeta-titulo"></h2>
                                <p class="tarjeta-texto"></p>
                                <ul class="tarjeta-tags"></ul>
                            </div>
                        </div>
                    </li>

                    <li class="nodo-shell hacia-izq" data-capacidad="sistemas" style="--marca:#00C49A; --retardo:4.4s">
                        <button class="nodo" type="button" aria-expanded="false" aria-controls="tarjeta-sistemas">Sistemas</button>
                        <div class="nodo-tarjeta" id="tarjeta-sistemas" role="group">
                            <div class="tarjeta-visual" aria-hidden="true"></div>
                            <div class="tarjeta-copy">
                                <h2 class="tarjeta-titulo"></h2>
                                <p class="tarjeta-texto"></p>
                                <ul class="tarjeta-tags"></ul>
                            </div>
                        </div>
                    </li>
                </ul>
            </section>

            <footer class="pie">
                <span class="pie-nota">ondigital.hn · Honduras</span>
            </footer>

        </main>
    </div>

    <script src="pantalla.js"></script>
</body>
</html>
