<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Outfit:wght@400;600&family=DM+Sans:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #050b1a; padding: 24px; }
  .type-row { display: flex; align-items: baseline; gap: 16px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .type-label { color: rgba(255,255,255,0.35); font-family: 'DM Sans', sans-serif; font-size: 11px; width: 120px; flex-shrink: 0; }
  .type-sample { color: #fff; }
</style>
</head>
<body>
  <div class="type-row"><div class="type-label">Syne / Hero 48px</div><div class="type-sample" style="font-family:'Syne',sans-serif;font-size:3rem;font-weight:700">OnDigital</div></div>
  <div class="type-row"><div class="type-label">Outfit / Heading 36px</div><div class="type-sample" style="font-family:'Outfit',sans-serif;font-size:2.25rem;font-weight:600">Sistema Dental</div></div>
  <div class="type-row"><div class="type-label">Outfit / Title 24px</div><div class="type-sample" style="font-family:'Outfit',sans-serif;font-size:1.5rem;font-weight:600">Expediente del Paciente</div></div>
  <div class="type-row"><div class="type-label">DM Sans / Body 16px</div><div class="type-sample" style="font-family:'DM Sans',sans-serif;font-size:1rem">Descripción general del tratamiento odontológico.</div></div>
  <div class="type-row"><div class="type-label">DM Sans / Small 14px</div><div class="type-sample" style="font-family:'DM Sans',sans-serif;font-size:0.875rem;color:rgba(255,255,255,0.7)">Texto de tablas, botones e inputs</div></div>
  <div class="type-row"><div class="type-label">Space Grotesk / Mono</div><div class="type-sample" style="font-family:'Space Grotesk',sans-serif;font-size:1rem">18.452.129-K — #PAC-0042</div></div>
</body>
</html>
