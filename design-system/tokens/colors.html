<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #050b1a; font-family: 'DM Sans', sans-serif; padding: 24px; }
  h2 { font-family: 'Outfit', sans-serif; color: #fff; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.5; margin-bottom: 16px; }
  .palette { display: flex; flex-direction: column; gap: 24px; }
  .palette-section { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch { width: 80px; }
  .swatch-color { height: 48px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
  .swatch-label { color: rgba(255,255,255,0.6); font-size: 10px; margin-top: 6px; word-break: break-all; }
</style>
</head>
<body>
  <div class="palette">
    <div>
      <h2>Dark Premium (SaaS)</h2>
      <div class="palette-section">
        <div class="swatch"><div class="swatch-color" style="background:#050b1a"></div><div class="swatch-label">bg-primary</div></div>
        <div class="swatch"><div class="swatch-color" style="background:#0a1128"></div><div class="swatch-label">bg-secondary</div></div>
        <div class="swatch"><div class="swatch-color" style="background:rgba(255,255,255,0.03)"></div><div class="swatch-label">bg-card</div></div>
        <div class="swatch"><div class="swatch-color" style="background:#a78bfa"></div><div class="swatch-label">accent-primary</div></div>
      </div>
    </div>
    <div>
      <h2>Salud (Credental)</h2>
      <div class="palette-section">
        <div class="swatch"><div class="swatch-color" style="background:#050f2c"></div><div class="swatch-label">bg-primary</div></div>
        <div class="swatch"><div class="swatch-color" style="background:#0a1a3a"></div><div class="swatch-label">bg-secondary</div></div>
        <div class="swatch"><div class="swatch-color" style="background:#00e5b0"></div><div class="swatch-label">accent-primary</div></div>
        <div class="swatch"><div class="swatch-color" style="background:#2b8af7"></div><div class="swatch-label">accent-secondary</div></div>
      </div>
    </div>
    <div>
      <h2>Comercial (E-commerce)</h2>
      <div class="palette-section">
        <div class="swatch"><div class="swatch-color" style="background:#0f0a0a"></div><div class="swatch-label">bg-primary</div></div>
        <div class="swatch"><div class="swatch-color" style="background:#1a1212"></div><div class="swatch-label">bg-secondary</div></div>
        <div class="swatch"><div class="swatch-color" style="background:#ff7a59"></div><div class="swatch-label">accent-primary</div></div>
        <div class="swatch"><div class="swatch-color" style="background:#ffb859"></div><div class="swatch-label">accent-secondary</div></div>
      </div>
    </div>
  </div>
</body>
</html>
