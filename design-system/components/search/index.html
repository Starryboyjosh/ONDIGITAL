<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="es-HN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Búsqueda con autocompletado | Sistema de diseño ONDIGITAL</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  /* El patrón declara el contrato ARIA de combobox (aria-expanded,
     aria-activedescendant, role="listbox"). Sin él la lista es invisible para
     un lector de pantalla y no hay forma de recorrerla con teclado. */
  body { min-height: 340px; }
  .autocomplete { position: relative; max-width: 360px; }
  .search-shell { position: relative; display: flex; align-items: center; }
  .search-icon { position: absolute; left: 12px; color: var(--soft); font-size: 13px; pointer-events: none; }
  .input {
    width: 100%; min-height: 40px;
    padding: 10px 36px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    color: var(--fg); font-family: inherit; font-size: 0.875rem;
  }
  .input::placeholder { color: var(--soft); }
  .input:focus { border-color: var(--accent-2); background: rgba(155, 140, 255, 0.07); }
  .btn-clear {
    position: absolute; right: 6px;
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px;
    background: none; border: none; border-radius: var(--radius-sm);
    color: var(--muted); font-size: 17px; line-height: 1; cursor: pointer;
  }
  .btn-clear:hover { background: rgba(255, 255, 255, 0.08); color: var(--fg); }
  .results {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    z-index: 10;
  }
  .result { padding: 10px 14px; cursor: pointer; }
  .result:hover, .result[aria-selected="true"] { background: rgba(155, 140, 255, 0.12); }
  .result-title { display: block; color: var(--fg); font-size: 0.875rem; }
  .result-meta {
    display: block; margin-top: 2px;
    font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted);
  }
  .results-empty { padding: 14px; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
  <div class="autocomplete">
    <label class="ds-heading" for="q">Buscar paciente</label>
    <div class="search-shell">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="q" class="input" type="text" value="María"
             role="combobox" aria-expanded="true" aria-controls="lista"
             aria-activedescendant="op-2" aria-autocomplete="list" autocomplete="off"
             placeholder="Nombre, identidad o expediente">
      <button class="btn-clear" type="button" aria-label="Limpiar búsqueda">×</button>
    </div>
    <div class="results" id="lista" role="listbox" aria-label="Resultados">
      <div class="result" id="op-1" role="option" aria-selected="false">
        <span class="result-title">María González Ruiz</span>
        <span class="result-meta">0801-1990-04567 · Limpieza dental</span>
      </div>
      <div class="result" id="op-2" role="option" aria-selected="true">
        <span class="result-title">María Fernanda López</span>
        <span class="result-meta">0501-1996-01284 · Ortodoncia</span>
      </div>
      <div class="result" id="op-3" role="option" aria-selected="false">
        <span class="result-title">María José Castillo</span>
        <span class="result-meta">0801-2001-11902 · Implante</span>
      </div>
    </div>
  </div>
</body>
</html>
