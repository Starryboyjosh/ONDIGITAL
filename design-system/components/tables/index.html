<!DOCTYPE html>
<html lang="es-HN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablas de datos | Sistema de diseño ONDIGITAL</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  /* La tabla vive dentro de un contenedor con overflow-x propio: en móvil la
     versión anterior desbordaba la página entera y escondía la columna de
     acciones. */
  .table-wrap {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow-x: auto;
  }
  table { width: 100%; min-width: 620px; border-collapse: collapse; }
  caption {
    padding: 14px 16px 0;
    text-align: left;
    font-family: var(--font-mono); font-size: 0.7rem;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent);
  }
  thead tr { border-bottom: 1px solid var(--border); }
  th {
    padding: 12px 16px; text-align: left;
    font-size: 0.72rem; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); white-space: nowrap;
  }
  td {
    padding: 13px 16px;
    font-size: 0.875rem; color: var(--fg);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: rgba(255, 255, 255, 0.03); }
  .cell-person { display: flex; align-items: center; gap: 10px; }
  .avatar {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(155, 140, 255, 0.18); color: var(--accent-2);
    font-size: 11px; font-weight: 600;
  }
  .mono { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
  .num { text-align: right; font-family: var(--font-mono); font-size: 0.82rem; white-space: nowrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 11px; border-radius: var(--radius-pill);
    font-size: 0.75rem; font-weight: 500;
    border: 1px solid currentColor; white-space: nowrap;
  }
  .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .badge-success { color: var(--ok);   background: rgba(123, 196, 154, 0.12); }
  .badge-warning { color: var(--warn); background: rgba(224, 168, 61, 0.12); }
  .actions { display: flex; gap: 4px; }
  /* Botón de icono con etiqueta accesible: antes eran emojis sueltos, que un
     lector de pantalla lee como "lápiz" sin decir sobre qué fila actúa. */
  .btn-icon {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; border-radius: var(--radius-sm);
    color: var(--muted); font-size: 14px; cursor: pointer;
  }
  .btn-icon:hover { background: rgba(255, 255, 255, 0.08); color: var(--fg); }
</style>
</head>
<body>
  <div class="table-wrap">
    <table>
      <caption>Citas de la semana</caption>
      <thead>
        <tr>
          <th scope="col">Paciente</th>
          <th scope="col">Identidad</th>
          <th scope="col">Fecha</th>
          <th scope="col">Saldo</th>
          <th scope="col">Estado</th>
          <th scope="col">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><div class="cell-person"><span class="avatar" aria-hidden="true">AG</span><span>Alberto Guerrero</span></div></td>
          <td class="mono">0801-1988-03412</td>
          <td>31 may 2026, 16:30</td>
          <td class="num">L 1,850.00</td>
          <td><span class="badge badge-success">Confirmada</span></td>
          <td><div class="actions">
            <button class="btn-icon" type="button" aria-label="Editar la cita de Alberto Guerrero">✎</button>
            <button class="btn-icon" type="button" aria-label="Eliminar la cita de Alberto Guerrero">🗑</button>
          </div></td>
        </tr>
        <tr>
          <td><div class="cell-person"><span class="avatar" aria-hidden="true">MG</span><span>María González</span></div></td>
          <td class="mono">0801-1990-04567</td>
          <td>01 jun 2026, 10:00</td>
          <td class="num">L 640.00</td>
          <td><span class="badge badge-warning">Pendiente</span></td>
          <td><div class="actions">
            <button class="btn-icon" type="button" aria-label="Editar la cita de María González">✎</button>
            <button class="btn-icon" type="button" aria-label="Eliminar la cita de María González">🗑</button>
          </div></td>
        </tr>
        <tr>
          <td><div class="cell-person"><span class="avatar" aria-hidden="true">SE</span><span>Sebastián Escoto</span></div></td>
          <td class="mono">0501-1996-01284</td>
          <td>02 jun 2026, 14:00</td>
          <td class="num">L 0.00</td>
          <td><span class="badge badge-success">Confirmada</span></td>
          <td><div class="actions">
            <button class="btn-icon" type="button" aria-label="Editar la cita de Sebastián Escoto">✎</button>
            <button class="btn-icon" type="button" aria-label="Eliminar la cita de Sebastián Escoto">🗑</button>
          </div></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
