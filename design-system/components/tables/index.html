<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Space+Grotesk:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #06160f; font-family: 'DM Sans', sans-serif; padding: 24px; }
  .table-container {
    background: rgba(255,255,255,0.02); backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead tr { border-bottom: 1px solid rgba(255,255,255,0.08); }
  th { padding: 12px 16px; text-align: left; color: rgba(255,255,255,0.4); font-size: 0.75rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; }
  td { padding: 13px 16px; color: rgba(255,255,255,0.85); font-size: 0.875rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .td-profile { display: flex; align-items: center; gap: 10px; }
  .avatar-sm { width: 30px; height: 30px; border-radius: 50%; background: rgba(18,184,134,0.2); color: #12b886; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .font-mono { font-family: 'Space Grotesk', sans-serif; font-size: 0.8rem; color: rgba(255,255,255,0.6); }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 500; }
  .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .badge-success { background: rgba(46,216,167,0.12); color: #2ed8a7; border: 1px solid rgba(46,216,167,0.2); }
  .badge-warning { background: rgba(242,200,121,0.12); color: #f2c879; border: 1px solid rgba(242,200,121,0.2); }
  .btn-action { background: none; border: none; cursor: pointer; opacity: 0.5; padding: 4px; border-radius: 6px; transition: opacity 0.2s, background 0.2s; font-size: 14px; }
  .btn-action:hover { opacity: 1; background: rgba(255,255,255,0.06); }
</style>
</head>
<body>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Paciente</th>
          <th>RUT</th>
          <th>Fecha Cita</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><div class="td-profile"><div class="avatar-sm">AG</div><span>Alberto Guerrero</span></div></td>
          <td class="font-mono">15.698.412-3</td>
          <td>31 May 2026, 16:30</td>
          <td><span class="badge badge-success">Confirmada</span></td>
          <td><button class="btn-action">✏️</button><button class="btn-action">🗑️</button></td>
        </tr>
        <tr>
          <td><div class="td-profile"><div class="avatar-sm">MG</div><span>María González</span></div></td>
          <td class="font-mono">12.548.963-2</td>
          <td>01 Jun 2026, 10:00</td>
          <td><span class="badge badge-warning">Pendiente</span></td>
          <td><button class="btn-action">✏️</button><button class="btn-action">🗑️</button></td>
        </tr>
        <tr>
          <td><div class="td-profile"><div class="avatar-sm">SE</div><span>Sebastián Escoto</span></div></td>
          <td class="font-mono">18.452.129-K</td>
          <td>02 Jun 2026, 14:00</td>
          <td><span class="badge badge-success">Confirmada</span></td>
          <td><button class="btn-action">✏️</button><button class="btn-action">🗑️</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
