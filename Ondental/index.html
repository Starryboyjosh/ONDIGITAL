<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — OnDental Clínica Digital</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/auth.js"></script>
</head>
<body class="login-viewport">

  <div class="card login-card">
    <div class="login-brand">
      <div class="login-logo">OD</div>
      <div class="login-brand-name">On<span class="acc">Dental</span></div>
    </div>
    
    <p class="login-lead">Sistema Inteligente de Gestión Dental e Historias Clínicas</p>

    <!-- Caja de alertas dinámicas -->
    <div id="login-alert" class="login-alert"></div>

    <form id="login-form">
      <div class="form-group" style="text-align: left;">
        <label class="form-label" for="username">Usuario Clínico</label>
        <input type="text" id="username" class="form-control" placeholder="Ej: admin o dentista" required autocomplete="username">
      </div>

      <div class="form-group" style="text-align: left; margin-bottom: 25px;">
        <label class="form-label" for="password">Contraseña</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem;">
        Verificar y Acceder
        <svg style="width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;" viewBox="0 0 24 24">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <div class="login-demo-box">
      <strong>Modo Demostración Activo</strong><br>
      • Usuario Administrador: <code>admin</code> / Contraseña: <code>1234</code><br>
      • Usuario Dentista: <code>dentista</code> / Contraseña: <code>1234</code>
    </div>
  </div>

  <script>
    // Comprobar parámetros de URL (ej. si fue redirigido por no estar autenticado)
    const urlParams = new URLSearchParams(window.location.search);
    const alertBox = document.getElementById('login-alert');

    if (urlParams.get('error') === 'unauthorized') {
      alertBox.textContent = 'Acceso Restringido. Por favor, inicie sesión.';
      alertBox.style.display = 'block';
    }

    // Lógica del Formulario
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const userVal = document.getElementById('username').value;
      const passVal = document.getElementById('password').value;

      // Ocultar alerta inicial
      alertBox.style.display = 'none';

      // Llamar al validador del script auth.js
      const result = window.auth.login(userVal, passVal);

      if (result.success) {
        // Redirigir al dashboard si las credenciales coinciden
        window.location.href = 'dashboard.html';
      } else {
        // Mostrar error con animación shake
        alertBox.textContent = result.message;
        alertBox.style.display = 'block';
        
        // Reiniciar animación shake
        alertBox.classList.remove('shake');
        void alertBox.offsetWidth; // Forzar reflow para reiniciar CSS animation
        alertBox.classList.add('shake');
      }
    });
  </script>
</body>
</html>
