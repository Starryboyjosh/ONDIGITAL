<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="__SURFACE__">
<title>__TITLE__</title>
<style>
:root {
/*THEME_VARS*/
}
/*VIEWER_CSS*/
</style>
</head>
<body>
<canvas id="stage" aria-label="Red 3D del grafo de conocimiento" role="img"></canvas>
<noscript><p class="fallback">Esta vista necesita JavaScript. El grafo completo tambien esta en GRAPH_REPORT.md y graph.json.</p></noscript>
<div id="gl-error" class="fallback" hidden></div>

<div id="ui" class="ui">
  <header class="bar bar-top" id="topbar" hidden>
    <div class="brand">
      <h1 id="title">__TITLE__</h1>
      <p id="subtitle" class="mono"></p>
    </div>
    <nav class="jump" id="jump" aria-label="Accesos rapidos"></nav>
    <div class="actions">
      <button type="button" data-act="replay" title="Volver a construir la red (R)">Reconstruir</button>
    </div>
  </header>

  <aside class="panel panel-left" id="controls" hidden>
    <button type="button" class="panel-toggle" data-fold="controls" aria-expanded="true">Controles</button>
    <div class="panel-body">
      <label class="field">
        <span>Buscar</span>
        <input type="search" id="search" placeholder="nodo, archivo, comunidad" autocomplete="off" spellcheck="false">
      </label>
      <div id="search-hits" class="hits" hidden></div>

      <fieldset class="field">
        <legend>Color por</legend>
        <div class="segmented" id="colormode"></div>
      </fieldset>

      <label class="field">
        <span>Grado minimo <b id="degval" class="mono">0</b></span>
        <input type="range" id="deg" min="0" max="20" value="0" step="1">
      </label>

      <fieldset class="field">
        <legend>Relaciones</legend>
        <label class="check"><input type="checkbox" id="showExtracted" checked> <span>Extraidas <i class="key key-solid"></i></span></label>
        <label class="check"><input type="checkbox" id="showInferred" checked> <span>Inferidas <i class="key key-dash"></i></span></label>
        <label class="check"><input type="checkbox" id="showPulse" checked> <span>Pulso de senal</span></label>
        <label class="check"><input type="checkbox" id="showLabels" checked> <span>Etiquetas de nodos clave</span></label>
      </fieldset>
    </div>
  </aside>

  <aside class="panel panel-right" id="inspector" hidden>
    <button type="button" class="close" data-act="deselect" aria-label="Cerrar">&times;</button>
    <div class="panel-body" id="inspector-body"></div>
  </aside>

  <div class="panel panel-legend" id="legend" hidden>
    <button type="button" class="panel-toggle" data-fold="legend" aria-expanded="true">Leyenda</button>
    <div class="panel-body" id="legend-body"></div>
  </div>

  <div class="stats mono" id="stats" hidden></div>
  <p class="hint mono" id="hint" hidden></p>
</div>

<p id="flash" class="flash mono"></p>

<div id="keys" class="modal" hidden>
  <div class="modal-card modal-keys">
    <header>
      <h2>Teclas</h2>
      <button type="button" data-act="keys-close" aria-label="Cerrar">&times;</button>
    </header>
    <div class="modal-body"><div id="keys-body"></div></div>
    <footer class="mono">La interfaz arranca oculta a proposito: solo la red. Cada panel tiene su tecla.</footer>
  </div>
</div>

<div id="tooltip" class="tooltip" hidden></div>

<div id="tablewrap" class="modal" hidden>
  <div class="modal-card">
    <header>
      <h2>Datos del grafo</h2>
      <input type="search" id="tsearch" placeholder="filtrar" autocomplete="off">
      <button type="button" data-act="table-close" aria-label="Cerrar">&times;</button>
    </header>
    <div class="modal-body"><table id="table"><thead></thead><tbody></tbody></table></div>
    <footer class="mono" id="tablefoot"></footer>
  </div>
</div>

<script>
const CFG = "__CONFIG__";
const GRAPH = "__DATA__";
</script>
<script>
/*VIEWER_JS*/
</script>
</body>
</html>
